<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خبرنامه شماره ۱ — کافه معدن</title>
    <link rel="icon" type="image/png" href="/images/Asset 1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/newsletter-detail.css">
</head>
<body>

<section class="cm-newsletter-detail">

    <!-- Background -->
    <div class="cm-newsletter-detail__bg" aria-hidden="true">
        <svg width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <pattern id="ndGeo" x="0" y="0" width="240" height="240" patternUnits="userSpaceOnUse">
                    <path d="M0,60 Q60,44 120,60 T240,55" fill="none" stroke="var(--nd-geo-line)" stroke-width="0.5"/>
                    <path d="M0,120 Q75,104 150,120 T240,115" fill="none" stroke="var(--nd-geo-line)" stroke-width="0.5"/>
                    <path d="M0,180 Q65,164 130,180 T240,175" fill="none" stroke="var(--nd-geo-line)" stroke-width="0.5"/>
                </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#ndGeo)"/>
        </svg>
    </div>

    <div class="cm-newsletter-detail__glow" aria-hidden="true"></div>

    <!-- Top Bar -->
    <div class="cm-newsletter-detail__topbar">
        <div class="cm-newsletter-detail__container">
            <a href="/cafemadan/vf902156-6677-62ef-a309-8765689349380/pocast" class="cm-newsletter-detail__back" aria-label="بازگشت به خبرنامه‌ها">
                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                    <path d="M9 6L15 12L9 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                بازگشت
            </a>

            <div class="cm-newsletter-detail__topbar-actions">
                <!-- Theme Toggle -->
                <button class="cm-nd-theme-toggle" id="ndThemeToggle" type="button" aria-label="تغییر تم">
                    <span class="cm-nd-theme-toggle__track">
                        <span class="cm-nd-theme-toggle__thumb">
                            <svg class="cm-nd-theme-toggle__icon cm-nd-theme-toggle__icon--sun" viewBox="0 0 24 24" fill="none" width="13" height="13">
                                <circle cx="12" cy="12" r="4" fill="currentColor"/>
                                <path d="M12 2V4M12 20V22M4 12H2M22 12H20M6.34 6.34L4.93 4.93M19.07 19.07L17.66 17.66M6.34 17.66L4.93 19.07M19.07 4.93L17.66 6.34" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            </svg>
                            <svg class="cm-nd-theme-toggle__icon cm-nd-theme-toggle__icon--moon" viewBox="0 0 24 24" fill="none" width="13" height="13">
                                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" fill="currentColor"/>
                            </svg>
                        </span>
                    </span>
                </button>

                <!-- Share Button -->
                <button class="cm-newsletter-detail__share-btn" id="shareBtn" type="button" aria-label="اشتراک‌گذاری">
                    <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                        <circle cx="18" cy="5" r="3" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="6" cy="12" r="3" stroke="currentColor" stroke-width="1.6"/>
                        <circle cx="18" cy="19" r="3" stroke="currentColor" stroke-width="1.6"/>
                        <path d="M8.5 10.5L15.5 6.5M8.5 13.5L15.5 17.5" stroke="currentColor" stroke-width="1.6"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Article Content -->
    <article class="cm-newsletter-detail__article">
        <div class="cm-newsletter-detail__container">

            <!-- Article Header -->
            <header class="cm-newsletter-detail__header">
               <div class="cm-newsletter-detail__header-meta">
    <span class="cm-newsletter-detail__header-issue" id="articleNumber"></span>
    <span class="cm-newsletter-detail__header-category" id="articleCategory"></span>
</div>

<h1 class="cm-newsletter-detail__header-title" id="articleTitle"></h1>

<p class="cm-newsletter-detail__header-subtitle" id="articleDescription"></p>

<div class="cm-newsletter-detail__header-info">

    <span class="cm-newsletter-detail__header-date">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
            <rect x="3" y="5" width="18" height="16" rx="2"
                  stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 10H21" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 3V7" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
            <path d="M16 3V7" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
        </svg>

        <span id="articleDate"></span>
    </span>

    <span class="cm-newsletter-detail__header-read-time">
        <svg viewBox="0 0 24 24" fill="none" width="14" height="14">
            <circle cx="12" cy="12" r="9"
                    stroke="currentColor" stroke-width="1.6"/>
            <path d="M12 7V12L15 14"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"/>
        </svg>

        <span id="articleTime"></span>
    </span>

</div>
            </header>

            <!-- Cover Image -->
            <div class="cm-newsletter-detail__cover">
                <img id="articleImage" src="" alt="">
                <div class="cm-newsletter-detail__cover-caption">تصویر: چشم‌انداز صنعت معدن ایران در سال ۱۴۰۳</div>
            </div>

            <!-- Article Body -->
            <div class="cm-newsletter-detail__body" id="articleContent"></div>

            <!-- Article Footer -->
            <footer class="cm-newsletter-detail__footer">
              

                <div class="cm-newsletter-detail__footer-share">
                    <span class="cm-newsletter-detail__footer-share-label">اشتراک‌گذاری:</span>
                    <div class="cm-newsletter-detail__footer-share-links">
                        <a href="#" class="cm-nd-share cm-nd-share--copy" aria-label="کپی لینک" id="copyLinkBtn">
                            <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                                <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.6"/>
                                <path d="M5 15H4C2.895 15 2 14.105 2 13V4C2 2.895 2.895 2 4 2H13C14.105 2 15 2.895 15 4V5" stroke="currentColor" stroke-width="1.6"/>
                            </svg>
                        </a>
                    </div>
                </div>
            </footer>

            <!-- Navigation: Previous / Next -->

        </div>
    </article>

</section>

<script src="/js/newsletter-detail.js"></script>
</body>
</html>
