<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <audio id="globalAudio"></audio>


    <div class="cm-sticky-player" id="stickyPlayer" role="region" aria-label="پخش‌کننده پادکست" style="margin-bottom: 8rem !important;">

        <!-- Top progress bar -->
        <div class="cm-sticky-player__progress-track">
            <div class="cm-sticky-player__progress-fill" id="stickyProgressFill" style="width: 0%"></div>
            <input class="cm-sticky-player__progress-input" id="stickyProgressInput" type="range" min="0" max="100" value="0" step="0.1" aria-label="پیشرفت پادکست"/>
        </div>

        <div class="cm-sticky-player__inner">

            <!-- Info: Cover + Title -->
            <div class="cm-sticky-player__info">
                <div class="cm-sticky-player__cover-wrap">
                    <img class="cm-sticky-player__cover" id="stickyCover" src="" alt=""/>
                </div>
                <div class="cm-sticky-player__meta">
                    <span class="cm-sticky-player__title" id="stickyTitle">—</span>
                    <span class="cm-sticky-player__episode" id="stickyEpisode">—</span>
                </div>
            </div>

            <!-- Controls Center -->
            <div class="cm-sticky-player__controls-center">

                <!-- Speed Button -->
                <div class="cm-sticky-player__speed-wrap">
                    <button class="cm-sticky-player__speed-btn" id="speedBtn" type="button" aria-label="تغییر سرعت پخش" title="سرعت پخش">
                        <svg viewBox="0 0 24 24" fill="none" width="16" height="16">
                            <path d="M13 2L3 14H12L11 22L21 10H12L13 2Z" fill="currentColor"/>
                        </svg>
                        <span class="cm-sticky-player__speed-value" id="speedValue">1x</span>
                    </button>
                    <!-- Speed Dropdown -->
                    <div class="cm-sticky-player__speed-dropdown" id="speedDropdown">
                        <button class="cm-sticky-player__speed-option" data-speed="0.5">.۵x</button>
                        <button class="cm-sticky-player__speed-option" data-speed="0.75">۰.۷۵x</button>
                        <button class="cm-sticky-player__speed-option cm-sticky-player__speed-option--active" data-speed="1">۱x</button>
                        <button class="cm-sticky-player__speed-option" data-speed="1.25">۱.۲۵x</button>
                        <button class="cm-sticky-player__speed-option" data-speed="1.5">۱.۵x</button>
                        <button class="cm-sticky-player__speed-option" data-speed="2">۲x</button>
                    </div>
                </div>

                <!-- Play/Pause -->
                <button class="cm-sticky-player__play-btn" id="stickyPlayBtn" type="button" aria-label="پخش/توقف">
                    <svg class="cm-sticky-player__play-icon" viewBox="0 0 24 24" fill="none" width="18" height="18">
                        <path d="M8 5.5L19 12L8 18.5V5.5Z" fill="currentColor"/>
                    </svg>
                    <svg class="cm-sticky-player__pause-icon" viewBox="0 0 24 24" fill="none" width="18" height="18" style="display:none">
                        <rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/>
                        <rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/>
                    </svg>
                </button>

                <!-- Volume Control -->
                <div class="cm-sticky-player__volume-wrap">
                    <button class="cm-sticky-player__volume-btn" id="volumeBtn" type="button" aria-label="کنترل صدا">
                        <svg class="cm-volume-icon cm-volume-icon--high" viewBox="0 0 24 24" fill="none" width="18" height="18">
                            <path d="M11 5L6 9H2V15H6L11 19V5Z" fill="currentColor"/>
                            <path d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 11.995C17.004 13.3208 16.4774 14.5924 15.54 15.53" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            <path d="M19.07 4.93C21.0146 6.87465 22.104 9.51465 22.104 12.265C22.104 15.0154 21.0146 17.6554 19.07 19.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <svg class="cm-volume-icon cm-volume-icon--low" viewBox="0 0 24 24" fill="none" width="18" height="18" style="display:none">
                            <path d="M11 5L6 9H2V15H6L11 19V5Z" fill="currentColor"/>
                            <path d="M15.54 8.46C16.4774 9.39764 17.004 10.6692 17.004 11.995C17.004 13.3208 16.4774 14.5924 15.54 15.53" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                        <svg class="cm-volume-icon cm-volume-icon--mute" viewBox="0 0 24 24" fill="none" width="18" height="18" style="display:none">
                            <path d="M11 5L6 9H2V15H6L11 19V5Z" fill="currentColor"/>
                            <line x1="22" y1="9" x2="16" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            <line x1="16" y1="9" x2="22" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <div class="cm-sticky-player__volume-slider-wrap">
                        <div class="cm-sticky-player__volume-track">
                            <div class="cm-sticky-player__volume-fill" id="volumeFill" style="width: 80%"></div>
                        </div>
                        <input class="cm-sticky-player__volume-input" id="volumeInput" type="range" min="0" max="100" value="80" step="1" aria-label="ولوم صدا"/>
                    </div>
                </div>

            </div>

            <!-- Time + Close -->
            <div class="cm-sticky-player__controls-right">
                <div class="cm-sticky-player__time" id="stickyTime">
                    <span class="cm-sticky-player__time-current">۰:۰</span>
                    <span class="cm-sticky-player__time-sep">/</span>
                    <span class="cm-sticky-player__time-total">۰:۰۰</span>
                </div>
                <button class="cm-sticky-player__close" id="stickyCloseBtn" type="button" aria-label="بستن پخش‌کننده">
                    <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                        <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </button>
            </div>

        </div>
    </div>  
</body>
</html>
