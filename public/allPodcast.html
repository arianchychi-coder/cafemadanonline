<style>
    .podcast-url-types {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 10px;
margin-bottom: 14px;
}

.podcast-url-type {
position: relative;
display: flex;
align-items: center;
justify-content: flex-start;
gap: 8px;
min-height: 52px;
padding: 0 12px;
border: 1px solid var(--border-color, #e5e7eb);
border-radius: 12px;
background: var(--surface-color, #fff);
color: var(--text-secondary, #6b7280);
cursor: pointer;
transition: all 0.2s ease;
font-family: inherit;
font-size: 12px;
font-weight: 600;
text-align: right;
}

.podcast-url-type:hover {
border-color: #a5b4fc;
background: rgba(99, 102, 241, 0.04);
}

.podcast-url-type.is-active {
border-color: #6366f1;
background: rgba(99, 102, 241, 0.07);
color: #4f46e5;
}

.podcast-url-type__icon {
width: 30px;
height: 30px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
border-radius: 8px;
background: #f3f4f6;
color: #6b7280;
transition: all 0.2s ease;
}

.podcast-url-type.is-active .podcast-url-type__icon {
background: rgba(99, 102, 241, 0.12);
color: #6366f1;
}

.podcast-url-type__check {
margin-right: auto;
width: 20px;
height: 20px;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
border-radius: 50%;
background: #e5e7eb;
color: transparent;
transition: all 0.2s ease;
}

.podcast-url-type.is-active .podcast-url-type__check {
background: #6366f1;
color: #fff;
}

/* Responsive */

@media (max-width: 900px) {
.podcast-url-types {
grid-template-columns: repeat(2, 1fr);
}
}

@media (max-width: 500px) {
.podcast-url-types {
grid-template-columns: 1fr;
}
}


.podcast-link-input {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
}

.podcast-link-input .form-control {
    flex: 1;
}
</style>


<style>
  .podcast-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(6px);
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.podcast-modal-content {
    background: #f1f1f1;
    padding: 2rem 2rem;
    border-radius: 1rem;
    width: min(600px, 90vw);
    max-height: 90vh;
    overflow-y: auto;
    overflow-x: hidden;
    box-sizing: border-box;
} 

.podcast-modal-content h3 {
    margin: 0 0 20px;
    text-align: center;
    font-size: 24px;
    color: #222;
}

.podcast-modal-content input,
.podcast-modal-content textarea {
    width: 100%;
    padding: 13px 15px;
    margin: 10px 0;
    border: 1px solid #ddd;
    border-radius: 12px;
    font-size: 15px;
    transition: .25s;
    outline: none;
    box-sizing: border-box;
}

.podcast-modal-content textarea {
    min-height: 120px;
    resize: vertical;
}

.podcast-modal-content input:focus {
    border-color: #F3B300;
    box-shadow: 0 0 0 4px rgba(243, 179, 0, .18);
}

.buttons {
    display: flex;
    justify-content: flex-end;
    gap: 12px;
    margin-top: 20px;
}

.btn-save,
.btn-cancel {
    display: flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: .25s;
}

.btn-save {
    background: linear-gradient(135deg, #F3B300, #d89b00);
    color: #111;
    box-shadow: 0 8px 18px rgba(243, 179, 0, .35);
}

.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(243, 179, 0, .45);
}

.btn-cancel {
    background: #202020;
    color: #fff;
    box-shadow: 0 8px 18px rgba(0, 0, 0, .25);
}

.btn-cancel:hover {
    transform: translateY(-2px);
    background: #111;
    box-shadow: 0 12px 24px rgba(0, 0, 0, .35);
}

.btn-save i,
.btn-cancel i {
    font-size: 17px;
}


#edit-status {
    width: 100%;
    height: 48px;
    padding: 0 14px;
    border: 1px solid #d8d8d8;
    border-radius: 10px;
    background: #fff;
    color: #222;
    font-size: 1.1rem !important;
    font-family: inherit;
    cursor: pointer;
    outline: none;
    transition: all 0.2s ease;
    direction: rtl;
    box-sizing: border-box;
}

#edit-status:hover {
    border-color: #F3B300;
}

#edit-status:focus {
    border-color: #F3B300;
    box-shadow: 0 0 0 3px rgba(243, 179, 0, 0.15);
}

#edit-status option {
    font-family: inherit;
    font-size: 1rem;
    padding: 10px;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

@keyframes pop {
    from {
        opacity: 0;
        transform: translateY(20px) scale(.95);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const platformButtons =
        document.querySelectorAll(".podcast-url-type");

    const inputContainers = {
        apple_music: document.getElementById("link-input-apple_music"),
        castbox: document.getElementById("link-input-castbox"),
        soundcloud: document.getElementById("link-input-soundcloud")
    };

    platformButtons.forEach(button => {

        button.addEventListener("click", function () {

            const type = this.dataset.type;

            // حذف active از همه دکمه‌ها
            platformButtons.forEach(btn => {
                btn.classList.remove("is-active");
            });

            // فعال کردن دکمه انتخاب‌شده
            this.classList.add("is-active");

            // نمایش input مربوط به همان پلتفرم
            Object.keys(inputContainers).forEach(key => {

                const container = inputContainers[key];

                if (!container) return;

                if (key === type) {
                    container.style.display = "flex";
                } else {
                    container.style.display = "none";
                }
            });

        });

    });

});
</script>
