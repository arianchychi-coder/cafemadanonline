<script>
document.addEventListener("DOMContentLoaded", () => {
    loadAllPodcasts();
});


/* =========================
   Helpers
========================= */

function toPersianDigits(value) {
    if (value === null || value === undefined) return "";

    return String(value).replace(/\d/g, digit => {
        return "۰۱۲۳۴۵۶۷۸۹"[digit];
    });
}


function escapeHtml(value) {
    if (value === null || value === undefined) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDuration(time) {
    if (!time) return "";

    const parts = String(time).split(":");

    if (parts.length === 2) {
        const minutes = parseInt(parts[0], 10);

        if (!isNaN(minutes)) {
            return `${toPersianDigits(minutes)} دقیقه`;
        }
    }

    return toPersianDigits(time);
}


function formatDate(dateValue) {
    if (!dateValue) return "";

    const date = new Date(dateValue);

    if (isNaN(date.getTime())) {
        return escapeHtml(dateValue);
    }

    return new Intl.DateTimeFormat("fa-IR", {
        year: "numeric",
        month: "long",
        day: "numeric"
    }).format(date);
}


/* =========================
   Load All Podcasts
========================= */

async function loadAllPodcasts() {

    const podcastGrid = document.getElementById("podcastGrid");
    const emptyState = document.getElementById("emptyState");

    if (!podcastGrid) {
        console.error("podcastGrid پیدا نشد!");
        return;
    }

    try {

        const response = await fetch("/api/podcast");

        console.log("STATUS:", response.status);

        if (!response.ok) {
            throw new Error("API Error: " + response.status);
        }

        const podcasts = await response.json();

        console.log("PODCASTS:", podcasts);


        /* فقط پادکست‌های منتشر شده */

        const publishedPodcasts = podcasts
            .filter(podcast => podcast.status === "published")
            .sort(
                (a, b) =>
                    new Date(b.createdAT) -
                    new Date(a.createdAT)
            );


       console.log("PUBLISHED:", publishedPodcasts);

const resultsCount = document.getElementById("resultsCount");

if (resultsCount) {
    resultsCount.textContent =
        `${toPersianDigits(publishedPodcasts.length)} پادکست`;
}


        podcastGrid.innerHTML = "";


        /* اگر پادکستی وجود نداشت */

        if (publishedPodcasts.length === 0) {

            podcastGrid.style.display = "none";

            if (emptyState) {
                emptyState.style.display = "flex";
            }

            return;
        }


        /* نمایش Grid */

        podcastGrid.style.display = "grid";

        if (emptyState) {
            emptyState.style.display = "none";
        }


        /* ساخت کارت‌ها */

        publishedPodcasts.forEach(podcast => {

            podcastGrid.insertAdjacentHTML(
                "beforeend",
                createAllPodcastCard(podcast)
            );

        });


        console.log(
            "GRID HTML:",
            podcastGrid.innerHTML
        );


        /* فعال کردن پلیر */

        initAllPodcastPlayers();


    } catch (error) {

        console.error(
            "LOAD PODCAST ERROR:",
            error
        );

        podcastGrid.innerHTML = "";

        podcastGrid.style.display = "none";

        if (emptyState) {
            emptyState.style.display = "flex";
        }

    }
}

/* =========================
   Audio Player
========================= */

function initAllPodcastPlayers() {

    const cards = document.querySelectorAll(
        ".cm-allpodcasts__card"
    );

    let currentAudio = null;
    let currentCard = null;


    cards.forEach(card => {

        const audio = card.querySelector(
            ".cm-allpodcasts__card-audio"
        );

        const playButton = card.querySelector(
            ".cm-allpodcasts__card-play"
        );


        if (!audio || !playButton) return;


        playButton.addEventListener("click", async () => {

            try {

                /* توقف پادکست قبلی */

                if (
                    currentAudio &&
                    currentAudio !== audio
                ) {

                    currentAudio.pause();

                    if (currentCard) {
                        resetAllPodcastCard(
                            currentCard
                        );
                    }

                }


                /* Play */

                if (audio.paused) {

                    await audio.play();

                    currentAudio = audio;
                    currentCard = card;


                    playButton.innerHTML = `
                        <svg
                            viewBox="0 0 24 24"
                            fill="currentColor"
                            width="14"
                            height="14">

                            <rect
                                x="7"
                                y="5"
                                width="3"
                                height="14"
                                rx="1"/>

                            <rect
                                x="14"
                                y="5"
                                width="3"
                                height="14"
                                rx="1"/>

                        </svg>
                    `;

                }

                /* Pause */

                else {

                    audio.pause();

                    resetAllPodcastCard(card);

                }

            } catch (error) {

                console.error(
                    "Audio play error:",
                    error
                );

            }

        });


        /* پایان پادکست */

        audio.addEventListener("ended", () => {

            audio.currentTime = 0;

            resetAllPodcastCard(card);


            if (currentAudio === audio) {

                currentAudio = null;
                currentCard = null;

            }

        });

    });

}


/* =========================
   Reset Play Button
========================= */

function resetAllPodcastCard(card) {

    const playButton = card.querySelector(
        ".cm-allpodcasts__card-play"
    );

    if (!playButton) return;


    playButton.innerHTML = `
        <svg
            viewBox="0 0 24 24"
            fill="none"
            width="14"
            height="14">

            <path
                d="M8 5.5L19 12L8 18.5V5.5Z"
                fill="currentColor"/>

        </svg>
    `;
}
</script>
