<script>

const newPasswordInput =
    document.getElementById("new-password");

const confirmPasswordInput =
    document.getElementById("confirm-password");

const savePasswordBtn =
    document.getElementById("save-password");

const passwordError =
    document.getElementById("password-error");


// ===============================
// ذخیره رمز جدید
// ===============================
savePasswordBtn.addEventListener("click", async function () {

    const newpassword =
        newPasswordInput.value;

    const confirmpassword =
        confirmPasswordInput.value;


    // ===============================
    // پاک کردن خطای قبلی
    // ===============================
    passwordError.textContent = "";
    passwordError.style.color = "red";


    // ===============================
    // خالی بودن
    // ===============================
    if (!newpassword || !confirmpassword) {

        passwordError.textContent =
            "رمز جدید و تکرار آن را وارد کنید";

        return;
    }


    // ===============================
    // بررسی Match
    // ===============================
    if (newpassword !== confirmpassword) {

        passwordError.textContent =
            "رمز عبور جدید و تکرار آن یکسان نیستند";

        return;
    }


    // ===============================
    // جلوگیری از کلیک چندباره
    // ===============================
    savePasswordBtn.disabled = true;
    savePasswordBtn.innerText = "در حال ذخیره...";


    try {

        // ===============================
        // ارسال به API
        // ===============================

        const id = localStorage.getItem("userId");

        const response = await fetch(`/api/setting/${id}`, {

            method: "Put",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
              newpassword,confirmpassword
            })

           
        });


        // ===============================
        // دریافت پاسخ
        // ===============================
        let data = {};

        try {
            data = await response.json();
        } catch {
            data = {};
        }


        console.log(
            "Password API:",
            response.status,
            data
        );


        // ===============================
        // خطا
        // ===============================
        if (!response.ok) {

            passwordError.textContent =
                data.message ||
                "ذخیره رمز انجام نشد";

            savePasswordBtn.disabled = false;
            savePasswordBtn.innerText =
                "ذخیره رمز عبور";

            return;
        }


        // ===============================
        // موفق
        // ===============================
        passwordError.style.color = "green";

        passwordError.textContent =
            data.message ||
            "رمز عبور با موفقیت ذخیره شد";


        // پاک کردن فیلدها
        newPasswordInput.value = "";
        confirmPasswordInput.value = "";


        savePasswordBtn.disabled = false;
        savePasswordBtn.innerText =
            "ذخیره رمز عبور";


    } catch (error) {

        console.error(
            "Password API Error:",
            error
        );

        passwordError.style.color = "red";

        passwordError.textContent =
            "خطا در ارتباط با سرور";


        savePasswordBtn.disabled = false;
        savePasswordBtn.innerText =
            "ذخیره رمز عبور";
    }

});

</script>
